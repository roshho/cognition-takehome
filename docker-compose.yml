services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - portal-data:/data
    environment:
      PORTAL_DB_PATH: /data/portal.db

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  portal-data:
